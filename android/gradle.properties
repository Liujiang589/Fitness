# Keep the platform charset: Java 17 reads worker @files using native.encoding on Windows.
org.gradle.jvmargs=-Xmx3072m
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# The project may live under a non-ASCII path (e.g. a Chinese user profile); AGP needs this opt-in there.
android.overridePathCheck=true
kotlin.code.style=official
ksp.useKSP2=true
