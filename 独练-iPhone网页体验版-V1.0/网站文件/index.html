  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div id="notice" role="status" hidden></div>
  <div id="shell">
    <header class="topbar"><a class="brand" href="#today" aria-label="独练首页"><img src="./icon.svg" width="30" height="30" alt=""><span>独练<span class="edition">网页体验版</span></span></a><button class="icon-button" data-action="profile" aria-label="我的与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></button></header>

    <nav id="nav" aria-label="主要页面"></nav>
